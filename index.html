<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECIAL ONE TEXAS BOT | الدخول الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080808;
            --card-dark: #131313;
            --card-top: #1c1511;
            --surface-soft: rgba(255, 255, 255, 0.03);
            --orange-main: #ff5500;
            --orange-light: #ff7a38;
            --orange-deep: #d64000;
            --green-live: #2ecc71;
            --text-white: #ffffff;
            --text-muted: #b3b3b3;
            --text-dim: #7a7a7a;
            --border-subtle: rgba(255, 85, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 8%, rgba(255, 85, 0, 0.18) 0%, rgba(8, 8, 8, 1) 60%), var(--bg-dark);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            position: relative;
            background: linear-gradient(180deg, var(--card-top) 0%, var(--card-dark) 100%);
            padding: 26px 22px 30px;
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.8), 0 0 28px rgba(255, 85, 0, 0.09);
            border: 1px solid var(--border-subtle);
            max-width: 430px;
            width: 100%;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--orange-light), transparent);
        }

        /* شريط علوي يشبه واجهة المنصة */
        .platform-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-soft);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }

        .texas-logo {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-white);
        }

        .texas-logo span {
            color: var(--orange-main);
        }

        .platform-tag {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--orange-light);
            background: rgba(255, 85, 0, 0.14);
            border: 1px solid rgba(255, 85, 0, 0.28);
            padding: 3px 10px;
            border-radius: 999px;
        }

        /* شعار البوت */
        .bot-emblem {
            width: 74px;
            height: 74px;
            border-radius: 22px;
            background: linear-gradient(145deg, var(--orange-light), var(--orange-deep));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 8px 24px rgba(255, 85, 0, 0.38);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .bot-emblem svg {
            width: 38px;
            height: 38px;
            fill: #ffffff;
        }

        .bot-title {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: var(--text-white);
            margin-bottom: 8px;
        }

        .bot-title span {
            color: var(--orange-light);
        }

        .badge {
            background: rgba(255, 85, 0, 0.12);
            color: var(--orange-light);
            border: 1px solid rgba(255, 85, 0, 0.32);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 14px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green-live);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green-live);
            animation: pulseDot 1.6s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.7; }
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text-white);
            line-height: 1.4;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.6;
        }

        /* لمسة مميزة: بطاقة وصول سريع بنمط المنصة */
        .quick-access-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .access-item {
            background: var(--surface-soft);
            border: 1px solid rgba(255, 85, 0, 0.2);
            border-radius: 12px;
            padding: 9px 10px;
            text-align: right;
        }

        .access-title {
            display: block;
            font-size: 12.5px;
            font-weight: 800;
            color: var(--orange-light);
        }

        .access-sub {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
        }

        .steps-box {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 20px;
            text-align: right;
            font-size: 13px;
            color: #dcdcdc;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }

        .step-num {
            background: rgba(255, 85, 0, 0.22);
            color: var(--orange-light);
            font-weight: 800;
            font-size: 12px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn {
            position: relative;
            overflow: hidden;
            display: block;
            background: linear-gradient(135deg, var(--orange-main), var(--orange-deep));
            color: var(--text-white);
            text-decoration: none;
            padding: 15px 22px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 800;
            box-shadow: 0 6px 22px rgba(255, 85, 0, 0.42);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: skewX(-20deg);
            animation: shineSweep 3.2s infinite;
        }

        @keyframes shineSweep {
            0%, 65% { left: -100%; }
            100% { left: 160%; }
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--orange-light), var(--orange-main));
            transform: translateY(-2px);
        }

        .copy-helper {
            margin-top: 12px;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            border-color: var(--orange-light);
            color: var(--text-white);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.6;
        }
    </style>
